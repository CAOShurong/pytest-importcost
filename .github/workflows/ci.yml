name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e .
      - run: python -m pytest tests -q
      - run: python -m pytest --importcost examples/tiny_suite
      - run: python -m pytest --importcost --importcost-budget-ms 10000 examples/tiny_suite
      - run: python -m pytest --importcost --importcost-forbid definitely_not_imported_xyz examples/tiny_suite
      - run: python -m pytest --importcost --importcost-blame examples/blame_suite
      - run: python -m pytest --importcost --importcost-suite examples/blame_suite
      - run: importcost --json -- examples/tiny_suite
      - run: importcost --blame --hide-stdlib -- examples/blame_suite
      - run: importcost --suite --hide-stdlib -- examples/blame_suite
      - run: importcost --save $RUNNER_TEMP/ic.json -- examples/tiny_suite
      - run: importcost --compare $RUNNER_TEMP/ic.json --new -- examples/tiny_suite
